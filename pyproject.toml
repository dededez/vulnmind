[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnmind"
version = "0.2.0"
description = "Authorized vulnerability analysis orchestration"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3", "langgraph>=1,<2", "sqlalchemy>=2,<3", "alembic>=1,<2", "psycopg[binary]>=3,<4", "pgvector>=0.3,<1", "pyyaml>=6,<7"]

[project.scripts]
vulnmind = "vulnmind.__main__:main"

[project.optional-dependencies]
hexstrike = ["mcp>=1.30,<2", "jsonschema>=4.23,<5", "requests>=2.31,<3", "sse-starlette>=2,<3", "starlette>=0.40,<0.49"]
test = ["pytest>=8,<10"]
checkpoint-local = ["langgraph-checkpoint-sqlite>=3,<4"]
checkpoint-postgres = ["langgraph-checkpoint-postgres>=3,<4"]
browser = ["playwright>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnmind.integrations.hexstrike" = ["resources/*.json", "resources/skills/*.md"]
"vulnmind.workbench" = ["static/*.html", "static/*.css", "static/*.js", "*.cjs", "resources/*.json", "resources/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
